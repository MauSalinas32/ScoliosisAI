# API + PostgreSQL. Copy .env.example to .env and set the secrets before `docker compose up --build`.
services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: medical_ai
      POSTGRES_USER: medical_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical_ai -d medical_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  medical-ai-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: medical-ai-system:3.3.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (at least 32 random characters)}
      DATABASE_URL: postgresql+psycopg2://medical_ai:${POSTGRES_PASSWORD}@postgres:5432/medical_ai
      # development: demo users + 2FA codes printed in `docker compose logs`; production: no demo users, no codes in logs
      ENVIRONMENT: ${ENVIRONMENT:-development}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      TZ: America/Mexico_City
      LOG_LEVEL: INFO
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - clinical_data:/app/data
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
        reservations:
          cpus: "0.5"
          memory: 1024M

volumes:
  pg_data:
  clinical_data:
  app_logs:
