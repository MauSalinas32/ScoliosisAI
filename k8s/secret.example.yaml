apiVersion: v1
kind: Secret
metadata:
  name: medical-ai-secret
  namespace: medical-system
type: Opaque
stringData:
  # Do NOT commit real values. Create the real secret with:  kubectl -n medical-system create secret generic medical-ai-secret ...
  SECRET_KEY: "REPLACE_WITH_RANDOM_STRING_OF_AT_LEAST_32_CHARACTERS"
  INITIAL_ADMIN_PASSWORD: "REPLACE_WITH_INITIAL_ADMIN_PASSWORD"
  POSTGRES_USER: "medical_ai"
  POSTGRES_PASSWORD: "REPLACE_WITH_DB_PASSWORD"
  POSTGRES_DB: "medical_ai_prod"
  DATABASE_URL: "postgresql+psycopg2://medical_ai:REPLACE_WITH_DB_PASSWORD@postgres-service:5432/medical_ai_prod"
