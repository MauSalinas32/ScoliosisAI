name: Medical AI System CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: scoliosis-diagnosis-system

jobs:
  # ─────────────────────────────────────────────────────────────
  # Stage 1: lint + static security analysis (blocking)
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint & Static Security Analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting & security tools
        run: pip install flake8==7.1.1 bandit==1.7.10

      - name: Flake8 (blocking - syntax errors, undefined names, unused imports/variables)
        run: |
          flake8 . --exclude=.git --select=E9,F63,F7,F82,F401,F811,F841 --show-source --statistics
          flake8 . --exclude=.git --count --exit-zero --max-complexity=12 --max-line-length=140 --statistics

      - name: Bandit SAST (blocking on medium/high findings)
        run: bandit -r . -x ./tests,./.git -ll -ii

  # ─────────────────────────────────────────────────────────────
  # Stage 2: automated tests (real model, real API, real database engines)
  # ─────────────────────────────────────────────────────────────
  test:
    name: Unit, Integration, Profiling & System Tests
    runs-on: ubuntu-24.04
    needs: lint
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: medical_ai_test
          POSTGRES_USER: medical_ai
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medical_ai" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install project dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the test suite with coverage gate (SQLite)
        # tests/conftest.py isolates data, uploads, reports and the database in a temporary directory
        run: |
          pytest -v \
            --cov=services --cov=pipeline --cov=domain --cov=api --cov=infrastructure --cov=ai \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=75 \
            --junitxml=test-results.xml \
            tests/

      - name: Integration and system tests against PostgreSQL (production database engine)
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://medical_ai:ci-only-password@localhost:5432/medical_ai_test
        run: pytest -q tests/integration tests/system

      - name: Memory profiling evidence
        run: pytest -q -s tests/profiling/test_memory_profiling.py | tee memory-profile.txt

      - name: Performance benchmark (packaged MobileNetV2 model)
        run: python tests/profiling/benchmark_performance.py --iterations 20 --output benchmark-ci.json

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            coverage.xml
            test-results.xml
            memory-profile.txt
            benchmark-ci.json

  # ─────────────────────────────────────────────────────────────
  # Stage 3: container build, smoke test, replica test, vulnerability scan
  # ─────────────────────────────────────────────────────────────
  build-container:
    name: Build, Smoke-Test & Scan Docker Image
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name (GHCR requires lowercase)
        id: meta
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container smoke test (liveness, readiness, read-only rootfs, non-root)
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp \
            -e SECRET_KEY=ci-smoke-secret-0123456789abcdef \
            -v smoke-data:/app/data -v smoke-logs:/app/logs -p 8000:8000 \
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          for i in $(seq 1 60); do curl -fs http://localhost:8000/health && break; sleep 2; done
          curl -fs http://localhost:8000/ready | tee ready.json
          grep -q '"ready"' ready.json
          test "$(docker exec smoke id -u)" != "0"
          docker logs smoke | tail -20
          docker rm -f smoke

      - name: Replica test (PostgreSQL + 2 replicas + load balancer)
        # Real containers: concurrent start-up on an empty database, 2FA code shared between replicas,
        # shared storage, measured 1-vs-2 replica throughput and availability with one replica down.
        run: |
          pip install httpx numpy pillow
          IMAGE=${{ steps.meta.outputs.image }}:${{ github.sha }} PY=python bash scripts/replica_test.sh | tee replica_test.txt
          grep -q "classify@replica2=200" replica_test.txt
          grep -q "20 x 200" replica_test.txt

      - name: Upload replica test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replica-test
          path: replica_test.txt

      - name: Trivy vulnerability scan (blocking on fixable CRITICAL)
        # Trivy runs from its published container image (pinned) instead of an installer action,
        # so the step does not depend on downloading a binary at run time.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image --scanners vuln --pkg-types os,library \
            --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            ${{ steps.meta.outputs.image }}:${{ github.sha }}

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ steps.meta.outputs.image }}:${{ github.sha }}
          docker push ${{ steps.meta.outputs.image }}:latest

  # ─────────────────────────────────────────────────────────────
  # Stage 4: Kubernetes manifest validation
  # ─────────────────────────────────────────────────────────────
  validate-k8s:
    name: Kubernetes Manifest Schema Validation
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Render with kustomize and validate against the Kubernetes 1.30 schemas
        run: |
          kubectl kustomize k8s > rendered.yaml
          kubeconform -strict -summary -kubernetes-version 1.30.0 rendered.yaml k8s/secret.example.yaml

  # ─────────────────────────────────────────────────────────────
  # Stage 5: ephemeral staging cluster (kind) - main only
  # ─────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Ephemeral Staging Cluster (kind)
    runs-on: ubuntu-24.04
    needs: [build-container, validate-k8s]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Rebuild image from cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ needs.build-container.outputs.image }}:${{ github.sha }}
          cache-from: type=gha

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: staging

      - name: Load image and deploy manifests
        run: |
          kind load docker-image ${{ needs.build-container.outputs.image }}:${{ github.sha }} --name staging
          kubectl apply -f k8s/namespace.yaml
          kubectl -n medical-system create secret generic medical-ai-secret \
            --from-literal=SECRET_KEY="$(openssl rand -base64 48)" \
            --from-literal=POSTGRES_USER=medical_ai \
            --from-literal=POSTGRES_PASSWORD=staging-pass \
            --from-literal=POSTGRES_DB=medical_ai_prod \
            --from-literal=DATABASE_URL=postgresql+psycopg2://medical_ai:staging-pass@postgres-service:5432/medical_ai_prod \
            --from-literal=INITIAL_ADMIN_PASSWORD=staging-admin-pass
          cd k8s
          # Point the kustomization at the image built for this commit
          sed -i 's|    newTag: "1.1.0"|    newName: ${{ needs.build-container.outputs.image }}\n    newTag: "${{ github.sha }}"|' kustomization.yaml
          # kind's local-path provisioner only supports ReadWriteOnce (single node)
          sed -i 's/ReadWriteMany/ReadWriteOnce/' pvc.yaml
          kubectl apply -k .

      - name: Wait for rollout
        run: |
          kubectl -n medical-system rollout status statefulset/medical-ai-postgres --timeout=180s
          kubectl -n medical-system rollout status deployment/medical-ai-deployment --timeout=300s

      - name: Smoke test through the Service
        run: |
          kubectl -n medical-system port-forward svc/medical-ai-service 8080:80 &
          sleep 5
          curl -fs http://localhost:8080/health
          curl -fs http://localhost:8080/ready
          # step 1 of the 2FA login must answer "2fa_required" and must NOT contain a token
          curl -fs -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"staging-admin-pass"}' | tee login.json
          grep -q '2fa_required' login.json
          ! grep -q 'access_token' login.json

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n medical-system get all,pvc
          kubectl -n medical-system describe pods
          kubectl -n medical-system logs deployment/medical-ai-deployment --tail=100
